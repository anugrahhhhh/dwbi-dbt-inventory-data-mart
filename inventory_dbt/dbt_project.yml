# dbt_project.yml — konfigurasi proyek Data Mart Inventory
name: inventory_dbt
version: "1.0.0"
profile: inventory_dbt          # harus sama dengan nama profil di profiles.yml

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  start_date: "2024-01-01"      # awal kalender dim_date
  end_date: "2025-12-31"        # akhir kalender dim_date (juga tanggal acuan aging)

models:
  inventory_dbt:
    staging:
      +materialized: view       # staging = view: ringan, selalu membaca data sumber terbaru
    marts:
      +materialized: table      # dimensi & fakta = tabel fisik untuk query BI
