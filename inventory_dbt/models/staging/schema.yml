version: 2

models:
  - name: stg_products
    description: "Produk yang sudah dibersihkan (TRIM, string kosong -> NULL). Masih berisi duplikat versi."
    columns:
      - name: product_id
        data_tests: [not_null]
  - name: stg_warehouses
    description: "Gudang yang sudah dibersihkan. Masih berisi duplikat versi."
    columns:
      - name: warehouse_id
        data_tests: [not_null]
  - name: stg_inventory_movements
    description: "Pergerakan stok dengan tipe data yang benar."
    columns:
      - name: transaction_id
        data_tests: [unique, not_null]
      - name: movement_type
        data_tests:
          - accepted_values:
              arguments:
                values: [PURCHASE, SALE, TRANSFER, LOST, DAMAGED, FOUND]
      - name: transfer_direction
        description: "OUT/IN untuk TRANSFER; NULL untuk tipe lain."
        data_tests:
          - accepted_values:
              arguments:
                values: [OUT, IN]
